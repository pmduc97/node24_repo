# Gradle JVM: 3GB heap, 512m Metaspace - needed for AGP + Kotlin + multiple plugins
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# Jetifier disabled: all dependencies already use AndroidX.
# Keeping it enabled causes Jetifier to fail on Java 24-compiled jars (byte-buddy etc.)
android.enableJetifier=false
android.defaults.buildfeatures.buildconfig=true
