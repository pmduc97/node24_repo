<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe Music Player - Web Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
      user-select: none;
    }

    body {
      background-color: #090B10;
      color: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Mobile Container Frame mockup */
    .app-frame {
      width: 100%;
      max-width: 420px;
      height: 840px;
      background: #0F111A;
      border-radius: 40px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 0 12px #1E2230;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Header */
    .header {
      padding: 24px 20px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #E94057, #F27121);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(233, 64, 87, 0.4);
    }

    .brand-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .info-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #AAA;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .info-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #FFF;
    }

    /* Actions Bar (Pick files/folders) */
    .actions-bar {
      padding: 16px 20px 10px;
      display: flex;
      gap: 10px;
    }

    .action-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      background: #1B1F2D;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      color: #FFF;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: #252B3E;
      border-color: rgba(233, 64, 87, 0.4);
    }

    .action-btn svg {
      width: 18px;
      height: 18px;
    }

    .btn-file svg { fill: #E94057; }
    .btn-folder svg { fill: #F27121; }

    /* Playlist Section */
    .playlist-header {
      padding: 12px 20px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      color: #667;
      letter-spacing: 1px;
    }

    .clear-btn {
      color: #FF5252;
      cursor: pointer;
      background: none;
      border: none;
      font-size: 11px;
      font-weight: 600;
    }

    .playlist-container {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .playlist-container::-webkit-scrollbar {
      width: 4px;
    }
    .playlist-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    .song-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background: #151824;
      border-radius: 14px;
      gap: 12px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    .song-item:hover {
      background: #1E2333;
    }

    .song-item.active {
      background: rgba(233, 64, 87, 0.12);
      border-color: rgba(233, 64, 87, 0.5);
    }

    .song-icon {
      width: 38px;
      height: 38px;
      background: #232838;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #889;
      font-size: 16px;
      flex-shrink: 0;
    }

    .song-item.active .song-icon {
      background: #E94057;
      color: #FFF;
      box-shadow: 0 4px 10px rgba(233, 64, 87, 0.4);
    }

    .song-info {
      flex: 1;
      overflow: hidden;
    }

    .song-title {
      font-size: 14px;
      font-weight: 600;
      color: #FFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-item.active .song-title {
      color: #E94057;
    }

    .song-artist {
      font-size: 12px;
      color: #778;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .song-delete {
      color: #556;
      cursor: pointer;
      padding: 4px;
      border: none;
      background: none;
    }
    .song-delete:hover {
      color: #FF5252;
    }

    /* Player Controls Bar */
    .player-controls-bar {
      background: #141722;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px 28px 0 0;
      padding: 16px 20px 24px;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .now-playing-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .album-art {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #8A2387, #E94057, #F27121);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(233, 64, 87, 0.3);
      flex-shrink: 0;
    }

    .track-details {
      flex: 1;
      overflow: hidden;
    }

    .track-title {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 12px;
      color: #889;
      margin-top: 2px;
    }

    .timer-btn {
      background: none;
      border: none;
      color: #889;
      cursor: pointer;
      position: relative;
    }
    .timer-btn.active {
      color: #FF5252;
    }
    .timer-badge {
      position: absolute;
      top: -2px;
      right: -2px;
      width: 8px;
      height: 8px;
      background: #FF5252;
      border-radius: 50%;
    }

    /* Progress bar */
    .progress-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .progress-slider {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .progress-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #E94057;
      cursor: pointer;
      box-shadow: 0 0 10px #E94057;
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #667;
    }

    /* Media Buttons Row */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 10px 0;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: #889;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .ctrl-btn:hover { color: #FFF; }
    .ctrl-btn.active { color: #E94057; }

    .play-btn {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #E94057, #F27121);
      border-radius: 50%;
      color: #FFF;
      font-size: 24px;
      box-shadow: 0 6px 18px rgba(233, 64, 87, 0.4);
    }
    .play-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 24px rgba(233, 64, 87, 0.6);
    }

    /* Sleep Timer Banner & Modal */
    .timer-banner {
      background: rgba(255, 82, 82, 0.15);
      border: 1px solid rgba(255, 82, 82, 0.3);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 11px;
      color: #FF5252;
      text-align: center;
      font-weight: 600;
      display: none;
    }

    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #1B1F2D;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #FFF;
    }

    .timer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .preset-btn {
      padding: 12px;
      background: #252B3E;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      color: #FFF;
      font-weight: 600;
      cursor: pointer;

    }
    .preset-btn:hover {
      background: #E94057;
    }

    .custom-timer-row {
      display: flex;
      gap: 8px;
    }

    .custom-input {
      flex: 1;
      background: #252B3E;
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      color: #FFF;
      font-size: 14px;
    }

    .custom-set-btn {
      background: #E94057;
      border: none;
      border-radius: 12px;
      padding: 0 16px;
      color: #FFF;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
    }

    .cancel-timer-btn {
      background: none;
      border: none;
      color: #FF5252;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    .close-modal-btn {
      background: none;
      border: none;
      color: #889;
      cursor: pointer;
      font-size: 13px;
    }

    /* Hidden inputs */
    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <div class="app-frame">
    <!-- Header -->
    <div class="header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
          </svg>
        </div>
        <div class="brand-title">Vibe Music</div>
      </div>
      <button class="info-btn" onclick="alert('Vibe Music Player Web Prototype\nHỗ trợ nghe thử bài hát mẫu hoặc chọn file/folder thực tế từ máy tính của bạn!')">
        ⓘ
      </button>
    </div>

    <!-- Actions (Pick Files / Pick Folder) -->
    <div class="actions-bar">
      <button class="action-btn btn-file" onclick="document.getElementById('fileInput').click()">
        <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
        Chọn File
      </button>
      <button class="action-btn btn-folder" onclick="document.getElementById('folderInput').click()">
        <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
        Chọn Folder
      </button>

      <!-- Hidden file inputs -->
      <input type="file" id="fileInput" multiple accept="audio/*" onchange="handleFileSelect(event)">
      <input type="file" id="folderInput" webkitdirectory directory onchange="handleFileSelect(event)">
    </div>

    <!-- Playlist Header -->
    <div class="playlist-header">
      <span id="playlistCount">DANH SÁCH PHÁT (0)</span>
      <button class="clear-btn" onclick="clearPlaylist()">Xóa hết</button>
    </div>

    <!-- Playlist List -->
    <div class="playlist-container" id="playlistContainer">
      <!-- Dynamic list items populated by JS -->
    </div>

    <!-- Player Controls Bar -->
    <div class="player-controls-bar">
      <div class="timer-banner" id="timerBanner">
        Hẹn giờ: Tắt nhạc sau <span id="timerCountdown">00:00</span>
      </div>

      <div class="now-playing-row">
        <div class="album-art">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
          </svg>
        </div>
        <div class="track-details">
          <div class="track-title" id="currentTrackTitle">Chưa chọn bài hát</div>
          <div class="track-artist" id="currentTrackArtist">Hãy chọn file hoặc folder nhạc</div>
        </div>
        <button class="timer-btn" id="timerBtn" onclick="openTimerModal()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61l1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42A8.962 8.962 0 0012 4c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
          </svg>
          <div class="timer-badge" id="timerBadge" style="display:none"></div>
        </button>
      </div>

      <!-- Seekbar -->
      <div class="progress-container">
        <input type="range" class="progress-slider" id="progressSlider" value="0" max="100" oninput="seekTrack(this.value)">
        <div class="time-labels">
          <span id="currentTimeLabel">00:00</span>
          <span id="totalTimeLabel">00:00</span>
        </div>
      </div>

      <!-- Media Control Buttons -->
      <div class="controls-row">
        <button class="ctrl-btn" id="shuffleBtn" onclick="toggleShuffle()" title="Trộn bài">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
          </svg>
        </button>

        <button class="ctrl-btn" onclick="prevTrack()" title="Bài trước">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
          </svg>
        </button>

        <button class="ctrl-btn play-btn" id="playBtn" onclick="togglePlay()" title="Phát / Dừng">
          ▶
        </button>

        <button class="ctrl-btn" onclick="nextTrack()" title="Bài tiếp theo">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
          </svg>
        </button>

        <button class="ctrl-btn" id="repeatBtn" onclick="toggleRepeat()" title="Lặp lại">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Sleep Timer Modal -->
    <div class="modal-overlay" id="timerModal">
      <div class="modal-card">
        <div class="modal-title">
          ⏱️ Hẹn Giờ Tắt Nhạc
        </div>
        <div class="timer-grid">
          <button class="preset-btn" onclick="setTimer(15)">15 Phút</button>
          <button class="preset-btn" onclick="setTimer(30)">30 Phút</button>
          <button class="preset-btn" onclick="setTimer(45)">45 Phút</button>
          <button class="preset-btn" onclick="setTimer(60)">60 Phút</button>
        </div>
        <div class="custom-timer-row">
          <input type="number" class="custom-input" id="customMins" placeholder="Nhập số phút...">
          <button class="custom-set-btn" onclick="setCustomTimer()">Đặt</button>
        </div>
        <div class="modal-actions">
          <button class="cancel-timer-btn" onclick="cancelTimer()">Hủy Hẹn Giờ</button>
          <button class="close-modal-btn" onclick="closeTimerModal()">Đóng</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Audio Element -->
  <audio id="audioPlayer"></audio>

  <script>
    let playlist = [
      {
        id: 'demo1',
        title: 'Vibe Synthwave Demo',
        artist: 'Royalty Free Audio',
        url: 'https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=synthwave-80s-110045.mp3'
      },
      {
        id: 'demo2',
        title: 'Chill Lo-Fi Beat Demo',
        artist: 'Ambient Sound',
        url: 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=lofi-study-112191.mp3'
      }
    ];

    let currentIndex = -1;
    let isPlaying = false;
    let isShuffle = false;
    let repeatMode = 0; // 0: off, 1: all, 2: one
    let timerInterval = null;
    let timerSeconds = 0;

    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const repeatBtn = document.getElementById('repeatBtn');
    const progressSlider = document.getElementById('progressSlider');
    const currentTimeLabel = document.getElementById('currentTimeLabel');
    const totalTimeLabel = document.getElementById('totalTimeLabel');

    // Init
    renderPlaylist();

    function renderPlaylist() {
      const container = document.getElementById('playlistContainer');
      document.getElementById('playlistCount').innerText = `DANH SÁCH PHÁT (${playlist.length})`;
      
      if (playlist.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding: 40px 20px; color:#556;">
            <div style="font-size:40px; margin-bottom:12px;">🎵</div>
            <div style="font-weight:600; color:#AAA;">Chưa có bài hát nào</div>
            <div style="font-size:12px; margin-top:4px;">Nhấn "Chọn File" hoặc "Chọn Folder" để thêm nhạc</div>
          </div>
        `;
        return;
      }

      container.innerHTML = playlist.map((song, i) => `
        <div class="song-item ${i === currentIndex ? 'active' : ''}" onclick="playAtIndex(${i})">
          <div class="song-icon">${i === currentIndex ? '▶' : '🎵'}</div>
          <div class="song-info">
            <div class="song-title">${escapeHtml(song.title)}</div>
            <div class="song-artist">${escapeHtml(song.artist)}</div>
          </div>
          <button class="song-delete" onclick="event.stopPropagation(); removeSong(${i})">✕</button>
        </div>
      `).join('');
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function handleFileSelect(e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      const audioFiles = files.filter(f => f.type.startsWith('audio/') || /\.(mp3|m4a|wav|flac|aac|ogg)$/i.test(f.name));

      audioFiles.forEach(file => {
        const name = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
        let title = name;
        let artist = 'File Cục Bộ';

        if (name.includes(' - ')) {
          const parts = name.split(' - ');
          artist = parts[0];
          title = parts.slice(1).join(' - ');
        }

        playlist.push({
          id: file.name + '-' + Math.random(),
          title: title,
          artist: artist,
          url: URL.createObjectURL(file)
        });
      });

      renderPlaylist();
      if (currentIndex === -1 && playlist.length > 0) {
        playAtIndex(0);
      }
    }

    function playAtIndex(index) {
      if (index < 0 || index >= playlist.length) return;
      currentIndex = index;
      const song = playlist[currentIndex];

      document.getElementById('currentTrackTitle').innerText = song.title;
      document.getElementById('currentTrackArtist').innerText = song.artist;

      audio.src = song.url;
      audio.play().then(() => {
        isPlaying = true;
        updatePlayBtn();
      }).catch(err => {
        console.log('Play error:', err);
      });

      renderPlaylist();
    }

    function togglePlay() {
      if (playlist.length === 0) return;
      if (currentIndex === -1) {
        playAtIndex(0);
        return;
      }

      if (isPlaying) {
        audio.pause();
        isPlaying = false;
      } else {
        audio.play();
        isPlaying = true;
      }
      updatePlayBtn();
    }

    function updatePlayBtn() {
      playBtn.innerText = isPlaying ? '❚❚' : '▶';
    }

    function nextTrack() {
      if (playlist.length === 0) return;
      if (isShuffle) {
        currentIndex = Math.floor(Math.random() * playlist.length);
      } else {
        currentIndex = (currentIndex + 1) % playlist.length;
      }
      playAtIndex(currentIndex);
    }

    function prevTrack() {
      if (playlist.length === 0) return;
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
        return;
      }
      if (isShuffle) {
        currentIndex = Math.floor(Math.random() * playlist.length);
      } else {
        currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      }
      playAtIndex(currentIndex);
    }

    function seekTrack(val) {
      if (!audio.duration) return;
      audio.currentTime = (val / 100) * audio.duration;
    }

    function toggleShuffle() {
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle('active', isShuffle);
    }

    function toggleRepeat() {
      repeatMode = (repeatMode + 1) % 3;
      if (repeatMode === 0) {
        repeatBtn.classList.remove('active');
        repeatBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>`;
      } else if (repeatMode === 1) {
        repeatBtn.classList.add('active');
        repeatBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>`;
      } else {
        repeatBtn.classList.add('active');
        repeatBtn.innerHTML = `<span style="font-size:12px; font-weight:bold;">🔂</span>`;
      }
    }

    function removeSong(index) {
      const isCurrent = (index === currentIndex);
      playlist.splice(index, 1);

      if (playlist.length === 0) {
        audio.pause();
        currentIndex = -1;
        isPlaying = false;
        updatePlayBtn();
        document.getElementById('currentTrackTitle').innerText = 'Chưa chọn bài hát';
        document.getElementById('currentTrackArtist').innerText = 'Hãy chọn file hoặc folder nhạc';
      } else if (isCurrent) {
        currentIndex = currentIndex % playlist.length;
        playAtIndex(currentIndex);
      } else if (index < currentIndex) {
        currentIndex--;
      }
      renderPlaylist();
    }

    function clearPlaylist() {
      playlist = [];
      removeSong(-1);
    }

    // Audio Listeners
    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      const progress = (audio.currentTime / audio.duration) * 100;
      progressSlider.value = progress;

      currentTimeLabel.innerText = formatTime(audio.currentTime);
      totalTimeLabel.innerText = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
      if (repeatMode === 2) {
        audio.currentTime = 0;
        audio.play();
      } else if (currentIndex < playlist.length - 1 || repeatMode === 1 || isShuffle) {
        nextTrack();
      } else {
        isPlaying = false;
        updatePlayBtn();
      }
    });

    function formatTime(secs) {
      if (isNaN(secs)) return '00:00';
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m.toString().padLeft(2, '0')}:${s.toString().padLeft(2, '0')}`;
    }

    String.prototype.padLeft = function(len, char) {
      return this.length >= len ? this : (char.repeat(len - this.length) + this);
    };

    // Sleep Timer Modal Logic
    function openTimerModal() {
      document.getElementById('timerModal').classList.add('active');
    }

    function closeTimerModal() {
      document.getElementById('timerModal').classList.remove('active');
    }

    function setTimer(mins) {
      cancelTimer();
      timerSeconds = mins * 60;
      document.getElementById('timerBanner').style.display = 'block';
      document.getElementById('timerBadge').style.display = 'block';
      document.getElementById('timerBtn').classList.add('active');

      updateTimerUI();
      timerInterval = setInterval(() => {
        if (timerSeconds > 0) {
          timerSeconds--;
          updateTimerUI();
        } else {
          cancelTimer();
          audio.pause();
          isPlaying = false;
          updatePlayBtn();
          alert('⏰ Đã hết giờ hẹn! Nhạc tự động dừng.');
        }
      }, 1000);

      closeTimerModal();
    }

    function setCustomTimer() {
      const mins = parseInt(document.getElementById('customMins').value);
      if (mins && mins > 0) {
        setTimer(mins);
      }
    }

    function updateTimerUI() {
      const m = Math.floor(timerSeconds / 60);
      const s = timerSeconds % 60;
      document.getElementById('timerCountdown').innerText = `${m.toString().padLeft(2, '0')}:${s.toString().padLeft(2, '0')}`;
    }

    function cancelTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      timerSeconds = 0;
      document.getElementById('timerBanner').style.display = 'none';
      document.getElementById('timerBadge').style.display = 'none';
      document.getElementById('timerBtn').classList.remove('active');
      closeTimerModal();
    }
  </script>
</body>
</html>
