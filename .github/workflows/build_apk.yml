name: Build Android APK

on:
  push:
    branches: [ "my_music_app", "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeMusicApp-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Commit and Push APK to releases/ folder
        run: |
          mkdir -p releases
          cp build/app/outputs/flutter-apk/app-release.apk releases/VibeMusicApp.apk
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/VibeMusicApp.apk
          git commit -m "chore: auto-update releases/VibeMusicApp.apk after build [skip ci]" || echo "No changes to commit"
          git push origin ${{ github.ref_name }}
